{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Students · Enrollment{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="brand" href="{% url 'student-list' %}">
      <span class="brand-mark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 8.5 12 4l10 4.5-10 4.5z"/><path d="M6 10.8V16c0 1.7 2.7 3 6 3s6-1.3 6-3v-5.2"/><path d="M22 8.5V14"/>
        </svg>
      </span>
      <span class="brand-name">Enrollment</span>
    </a>

    <nav class="menu" aria-label="Main">
      <a class="menu-item on" href="{% url 'student-list' %}" aria-current="page">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
        <span>Students</span>
      </a>
    </nav>
  </aside>

  <main class="main">
    <header class="page-head">
      <div>
        <h1>{% block heading %}Students{% endblock %}</h1>
        <p>{% block sub %}Manage and review every enrollee in this class.{% endblock %}</p>
      </div>
      <button class="btn primary" type="button" data-open="add-modal">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Add student
      </button>
    </header>
    <div class="page-body">{% block content %}{% endblock %}</div>
  </main>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
